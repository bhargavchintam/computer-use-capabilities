# Version overlay: shared by every tenant running AcmeCore 7.3.x, so a vendor change costs one
# patch per affected step per release, never one per tenant. It re-targets steps by stable id;
# it cannot add, remove or reorder steps, change a commit step's checkpoints, or touch a
# capability's contract. Reviewed and approved like a capability (production requires it).
id: acmecore-7.3
status: approved
description: AcmeCore 7.3 renamed the "Member Inquiry" menu item to "Member Lookup" and moved it to /cu/lookup.
  (7.3 also relabelled Search to Find; the recorded attribute fallback still finds it, so that step degrades with
  a warning instead of failing, and no patch is required.)
applies_to:
  product: acmecore
  versions: '>=7.3,<7.4'
capabilities:
  acmecore.member.get_share_balance:
    steps:
      click_member_inquiry:
        target:
          container:
          - frame:nav
          strategies:
          - kind: role_name
            role: link
            name: Member Lookup
          - kind: attr
            tag: a
            attrs:
              href: /cu/lookup
        expect:
        - document_changed:
            container:
            - frame:work
        - text_visible:
            container:
            - frame:work
            text: Member Lookup
  acmecore.member.get_savings_balance_and_shares:
    steps:
      click_member_inquiry:
        target:
          container:
          - frame:nav
          strategies:
          - kind: role_name
            role: link
            name: Member Lookup
          - kind: attr
            tag: a
            attrs:
              href: /cu/lookup
        expect:
        - document_changed:
            container:
            - frame:work
        - text_visible:
            container:
            - frame:work
            text: Member Lookup
  acmecore.share.open_share_account:
    steps:
      click_member_inquiry:
        target:
          container:
          - frame:nav
          strategies:
          - kind: role_name
            role: link
            name: Member Lookup
          - kind: attr
            tag: a
            attrs:
              href: /cu/lookup
        expect:
        - document_changed:
            container:
            - frame:work
        - text_visible:
            container:
            - frame:work
            text: Member Lookup
labels:
  share_type:
    Holiday Club: Christmas Club
  share_product:
    Holiday Club: Christmas Club
approval:
