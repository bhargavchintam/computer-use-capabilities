# App profile: vendor-product knowledge shared by every tenant running AcmeCore.
# Written once per product (by an engineer), reused by every capability and tenant.
product: acmecore
profile_version: "1.0.0"
description: >-
  AcmeCore core banking (fictional vendor). Frameset UI with banner, nav and
  work frames; messages are printed as red text in the work frame.
versions_supported: ">=7.2,<8.0"
home_route: /core/main

version_probe:
  container: ["frame:banner"]
  pattern: 'AcmeCore (\d+\.\d+\.\d+)'

# Deterministic sign-on. The LLM never sees or types credentials: secret refs are
# resolved from the tenant's secret store at runtime and scrubbed from all output.
auth:
  route: /signon
  steps:
    - id: enter_operator_id
      intent: Type the operator ID
      action: fill
      effect: input
      target:
        strategies:
          - {kind: label, role: textbox, label: "Operator ID:"}
          - {kind: attr, tag: input, attrs: {name: txtOpr}}
      value: {secret: operator_id}
      provenance: author
    - id: enter_password
      intent: Type the password
      action: fill
      effect: input
      target:
        strategies:
          - {kind: label, role: textbox, label: "Password:"}
          - {kind: attr, tag: input, attrs: {name: txtPwd}}
      value: {secret: operator_password}
      provenance: author
    - id: submit_sign_on
      intent: Submit the sign-on form
      action: click
      effect: read
      target:
        strategies:
          - {kind: role_name, role: button, name: "Sign On"}
          - {kind: attr, tag: input, attrs: {name: btnSignOn}}
      provenance: author
  success:
    text_matches: {container: ["frame:banner"], pattern: "Operator: "}
  failures:
    invalid_credentials: "(?i)invalid operator id or password"
    locked: "(?i)operator id is locked"

# Runtime conditions checked on every wait, in this order, in discovery AND replay.
detectors:
  - id: session_expired
    description: The session timed out and the sign-on page is shown (often inside the work frame).
    when:
      any_of:
        - {text_matches: {container: ["frame:work"], pattern: "(?i)your session has expired"}}
        - {text_matches: {container: [], pattern: "(?i)your session has expired"}}
    kind: recoverable
    handler: {reauth: true, redrive: true}
    max_times: 1
    failure_code: SESSION_LOST

  - id: server_error
    description: Application error page (HTTP 500).
    when:
      any_of:
        - {text_matches: {container: ["frame:work"], pattern: "(?i)server error in '/acmecore' application"}}
        - {text_matches: {container: [], pattern: "(?i)server error in '/acmecore' application"}}
    kind: recoverable
    handler: {redrive: true}
    max_times: 2
    failure_code: APP_ERROR

  - id: maintenance_notice
    description: System notice overlay that blocks the page until acknowledged.
    when:
      element_present:
        container: ["frame:work"]
        strategies:
          - {kind: role_name, role: button, name: Acknowledge}
    kind: recoverable
    handler:
      click:
        container: ["frame:work"]
        strategies:
          - {kind: role_name, role: button, name: Acknowledge}
    max_times: 3

  - id: supervisor_override
    description: The transaction exceeds the operator's limit; a supervisor must approve with a PIN.
    when:
      text_matches: {container: ["frame:work"], pattern: "(?i)supervisor override required"}
    kind: human_required
    implies: not_committed

  - id: not_authorized
    description: The operator lacks the entitlement for this function (not a member-specific result).
    when:
      text_matches: {container: ["frame:work"], pattern: "(?i)you are not authorized to use this function"}
    kind: fatal
    failure_code: PERMISSION_DENIED

# Native JS dialogs. Anything not listed (and not declared on the step) fails safe:
# confirm() is dismissed, alert() acknowledged, and the run stops as UNRECOGNIZED_STATE.
dialogs:
  - match: "(?i)password will expire"
    action: accept
    kind: recoverable
    description: Informational password-expiry reminder.

# Product-wide messages and the business outcome each one means. Capabilities
# reference these by id, so the wording lives in one place per product.
messages:
  member_not_found:
    pattern: "(?i)no member found"
    container: ["frame:work"]
    routes: ["/core/inquiry", "/cu/lookup", "/core/member/*"]
    outcome: MEMBER_NOT_FOUND
    description: No member exists with this member number.
    caller_guidance: Ask the user to double-check the member number. Safe to retry with a corrected number.
  member_number_invalid:
    pattern: "(?i)member # must be numeric"
    container: ["frame:work"]
    routes: ["/core/inquiry", "/cu/lookup"]
    outcome: INPUT_REJECTED_BY_APP
    description: The application rejected the member number format.
    caller_guidance: Correct the member number (digits only) and retry.
  account_restricted:
    pattern: "(?i)access denied: this member record is restricted"
    container: ["frame:work"]
    routes: ["/core/inquiry", "/cu/lookup", "/core/member/*"]
    outcome: ACCOUNT_RESTRICTED
    description: The member record is restricted (e.g. an employee account) for this operator.
    caller_guidance: Retrying will not help; route the request to staff with supervisor access.
  insufficient_funds:
    pattern: "(?i)exceeds the available balance"
    container: ["frame:work"]
    routes: ["/core/member/*/newshare"]
    outcome: INSUFFICIENT_FUNDS
    description: The funding share does not have enough available balance.
    caller_guidance: Tell the user the available balance is too low; retry with a smaller amount.
  invalid_amount:
    pattern: "(?i)initial deposit must be a valid amount"
    container: ["frame:work"]
    routes: ["/core/member/*/newshare"]
    outcome: INVALID_AMOUNT
    description: The application rejected the deposit amount.
    caller_guidance: Correct the amount (positive, at most two decimals) and retry.
  invalid_nickname:
    pattern: "(?i)nickname may contain letters, numbers and spaces only"
    container: ["frame:work"]
    routes: ["/core/member/*/newshare"]
    outcome: INVALID_NICKNAME
    description: The nickname contains characters the application does not accept.
    caller_guidance: Use letters, numbers and spaces only (max 20) and retry.
  request_already_processed:
    pattern: "(?i)already been processed or has expired"
    container: ["frame:work"]
    routes: ["/core/member/*/newshare/*"]
    outcome: REQUEST_ALREADY_PROCESSED
    description: The application refused a repeated submission.
    caller_guidance: Do not retry. Check the member's shares first; the earlier submission may have succeeded.
    retry_safe: false

error_region:
  containers: [["frame:work"]]
  kind: red_text

# Labels whose values are PII: masked for the model, in logs and in screenshots.
sensitive_labels: ["Name", "SSN", "Date of Birth", "Address", "Phone", "Email", "Password", "Supervisor PIN"]

risk:
  commit_names: "(?i)^(confirm|submit|post|approve|save|transfer|delete|void|reverse|close account|open account)$"
  commit_routes: ["/core/member/*/newshare/confirm", "/core/member/*/newshare/override"]

timeouts:
  step_ms: 10000
  poll_ms: 250
  settle_ms: 350
  handoff_ms: 900000
