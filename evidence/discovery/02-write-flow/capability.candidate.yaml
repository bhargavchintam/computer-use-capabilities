    ACCOUNT_RESTRICTED:
      ref: account_restricted
    INSUFFICIENT_FUNDS:
      ref: insufficient_funds
    INVALID_AMOUNT:
      ref: invalid_amount
    INVALID_NICKNAME:
      ref: invalid_nickname
    REQUEST_ALREADY_PROCESSED:
      ref: request_already_processed
  success:
    all_of:
    - text_visible:
        container:
        - frame:work
        text: Share Opened
    - field_value:
        target:
          container:
          - frame:work
          strategies:
          - kind: label
            role: cell
            label: 'Member #:'
        equals:
          param: member_number
    - outputs_present:
      - confirmation_number
      - share_id
provenance:
