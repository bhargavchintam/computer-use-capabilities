        css_path: body:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1) > td:nth-of-type(1)
          > form:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(4) > td:nth-of-type(2)
          > input:nth-of-type(1)
        bbox:
        - 104.0
        - 130.0
        - 69.0
        - 22.0
    expect:
    - document_changed:
