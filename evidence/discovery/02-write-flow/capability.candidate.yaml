          > form:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(3) > td:nth-of-type(2)
          > input:nth-of-type(1)
        bbox:
        - 88.0
        - 105.0
        - 58.0
        - 22.0
    expect:
    - document_changed:
        container:
        - frame:work
    - text_visible:
        container:
        - frame:work
        text: Member Summary
    timeout_ms: 10000
    provenance: agent
  - id: click_open_new_share
    intent: Proceed to the Open New Share form
    action: click
    effect: read
    target:
      container:
      - frame:work
      strategies:
      - kind: role_name
        role: link
        name: Open New Share
      fingerprint:
        tag: a
        role: link
        name: Open New Share
        css_path: body:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1) > td:nth-of-type(1)
          > a:nth-of-type(1)
        bbox:
        - 10.0
        - 274.0
        - 114.0
        - 15.0
    expect:
    - document_changed:
        container:
        - frame:work
    - text_visible:
        container:
        - frame:work
        text: Open New Share
    timeout_ms: 10000
    provenance: agent
  - id: select_share_type
    intent: Select requested share product
    action: select
    effect: input
    target:
      container:
      - frame:work
      strategies:
      - kind: label
        role: combobox
        label: 'Share Type:'
      - kind: attr
        tag: select
        attrs:
          name: ddlType
      fingerprint:
        tag: select
        role: combobox
        name: ''
        label: 'Share Type:'
        css_path: body:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1) > td:nth-of-type(1)
          > form:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1) > td:nth-of-type(2)
          > select:nth-of-type(1)
        bbox:
        - 104.0
        - 50.0
        - 142.0
        - 19.0
    value:
