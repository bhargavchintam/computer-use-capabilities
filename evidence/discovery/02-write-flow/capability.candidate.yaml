schema_version: '1.0'
id: acmecore.share.open_share_account
version: 1.0.0
status: draft
title: Open New Share Account for Member
description: |-
  Discovered for: Open a new {{share_product}} share for member {{member_number}} with an initial deposit of {{initial_deposit}} and the nickname {{nickname}}, and return the confirmation number and the new share ID
  Flow: Open Member Inquiry to find the member and share options -> Enter member number to search -> Search for the member -> Proceed to the Open New Share form -> Select requested share product -> Enter the initial deposit amount -> Enter the member-facing nickname -> Continue to the confirmation step -> Confirm to open the new share as requested -> Bind the confirmation number from the success screen -> Bind the new share ID from the success screen
contract:
  inputs:
    member_number:
      type: string
      description: Member number of the account holder for whom the share is opened
      pattern: ^[0-9]{5}$
      sensitivity: pii_identifier
      required: true
    share_product:
      type: enum
      description: Share product type to open
      enum:
      - Holiday Club
      - Vacation Club
      sensitivity: internal
      required: true
    initial_deposit:
      type: money
      description: Initial deposit amount funding the new share
      sensitivity: confidential
      required: true
    nickname:
      type: string
      description: Member-facing nickname/label for the new share
      sensitivity: internal
      required: true
  outputs:
    confirmation_number:
      type: identifier
      description: Confirmation number returned by the core for the share opening transaction
      sensitivity: internal
    share_id:
      type: identifier
      description: Identifier of the newly opened share account
      sensitivity: pii_identifier
  outcomes:
    MEMBER_NOT_FOUND:
      description: No member exists with this member number.
      caller_guidance: Ask the user to double-check the member number. Safe to retry with a corrected number.
      retry_safe: true
    INPUT_REJECTED_BY_APP:
      description: The application rejected the member number format.
      caller_guidance: Correct the member number (digits only) and retry.
      retry_safe: true
    ACCOUNT_RESTRICTED:
      description: The member record is restricted (e.g. an employee account) for this operator.
      caller_guidance: Retrying will not help; route the request to staff with supervisor access.
      retry_safe: true
    INSUFFICIENT_FUNDS:
      description: The funding share does not have enough available balance.
      caller_guidance: Tell the user the available balance is too low; retry with a smaller amount.
      retry_safe: true
    INVALID_AMOUNT:
      description: The application rejected the deposit amount.
      caller_guidance: Correct the amount (positive, at most two decimals) and retry.
      retry_safe: true
    INVALID_NICKNAME:
      description: The nickname contains characters the application does not accept.
      caller_guidance: Use letters, numbers and spaces only (max 20) and retry.
      retry_safe: true
    REQUEST_ALREADY_PROCESSED:
      description: The application refused a repeated submission.
      caller_guidance: Do not retry. Check the member's shares first; the earlier submission may have succeeded.
      retry_safe: false
    APPROVAL_DENIED:
      description: A human operator declined the commit step; nothing was committed.
      caller_guidance: Tell the user staff declined the request. Do not retry without new instructions.
      retry_safe: true
  effects: commit
  idempotent: false
  example:
    input:
      member_number: <string>
      share_product: <enum>
      initial_deposit: <money>
      nickname: <string>
    output:
      confirmation_number: <identifier>
      share_id: <identifier>
implementation:
  app:
    product: acmecore
    versions: '>=7.2,<8.0'
    surface: web
  entry:
    route: /core/main
  preconditions:
  - authenticated_session
  steps:
  - id: click_member_inquiry
    intent: Open Member Inquiry to find the member and share options
    action: click
    effect: read
    target:
      container:
      - frame:nav
      strategies:
      - kind: role_name
        role: link
        name: Member Inquiry
      - kind: attr
        tag: a
        attrs:
          href: /core/inquiry
      fingerprint:
        tag: a
        role: link
        name: Member Inquiry
        css_path: body:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(2) > td:nth-of-type(1)
          > a:nth-of-type(1)
        bbox:
        - 10.0
        - 34.0
        - 90.0
        - 15.0
    expect:
    - document_changed:
        container:
        - frame:work
    - text_visible:
        container:
        - frame:work
        text: Member Inquiry
    timeout_ms: 10000
    provenance: agent
  - id: fill_member_number
    intent: Enter member number to search
    action: fill
    effect: input
    target:
      container:
      - frame:work
      strategies:
      - kind: label
        role: textbox
        label: 'Member #:'
      - kind: attr
        tag: input
        attrs:
          name: txtMbr
      fingerprint:
        tag: input
        role: textbox
        name: ''
        label: 'Member #:'
        css_path: body:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1) > td:nth-of-type(1)
          > form:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1) > td:nth-of-type(2)
          > input:nth-of-type(1)
        bbox:
        - 88.0
        - 50.0
        - 80.0
        - 22.0
    value:
      param: member_number
    expect:
    - field_value:
        equals:
          param: member_number
    timeout_ms: 10000
    provenance: agent
  - id: click_search
    intent: Search for the member
    action: click
    effect: read
    target:
      container:
      - frame:work
      strategies:
      - kind: role_name
        role: button
        name: Search
      - kind: attr
        tag: input
        attrs:
          name: btnSrch
      fingerprint:
        tag: input
        role: button
        name: Search
