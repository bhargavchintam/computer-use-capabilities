    timeout_ms: 10000
    provenance: agent
  - id: fill_initial_deposit
    intent: Enter the initial deposit amount
    action: fill
    effect: input
    target:
      container:
      - frame:work
      strategies:
      - kind: label
        role: textbox
        label: 'Initial Deposit:'
      - kind: attr
        tag: input
        attrs:
          name: txtAmt
      fingerprint:
        tag: input
        role: textbox
        name: ''
        label: 'Initial Deposit:'
        css_path: body:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1) > td:nth-of-type(1)
          > form:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(2) > td:nth-of-type(2)
          > input:nth-of-type(1)
        bbox:
        - 104.0
        - 75.0
        - 94.0
        - 22.0
    value:
      param: initial_deposit
    expect:
    - field_value:
        equals:
          param: initial_deposit
    timeout_ms: 10000
    provenance: agent
  - id: fill_nickname
    intent: Enter the member-facing nickname
    action: fill
    effect: input
    target:
      container:
      - frame:work
      strategies:
      - kind: label
        role: textbox
        label: 'Nickname:'
      - kind: attr
        tag: input
        attrs:
          name: txtNick
      fingerprint:
        tag: input
        role: textbox
        name: ''
        label: 'Nickname:'
        css_path: body:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1) > td:nth-of-type(1)
          > form:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(3) > td:nth-of-type(2)
