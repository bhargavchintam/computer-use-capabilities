  - id: click_confirm
    intent: Confirm to open the new share as requested
    action: click
    effect: commit
    target:
      container:
      - frame:work
      strategies:
      - kind: role_name
        role: button
        name: Confirm
      - kind: attr
        tag: input
        attrs:
          name: btnConfirm
      fingerprint:
        tag: input
        role: button
        name: Confirm
        css_path: body:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1) > td:nth-of-type(1)
          > form:nth-of-type(1) > input:nth-of-type(2)
        bbox:
        - 10.0
        - 213.0
        - 63.0
        - 22.0
    pre:
    - field_value:
        target:
          container:
          - frame:work
          strategies:
          - kind: label
            role: cell
            label: 'Member #:'
        equals:
