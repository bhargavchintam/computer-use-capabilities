name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv sync
          uv run playwright install --with-deps chromium
      - name: Lint and types
        run: |
          uv run ruff check src tests mock_bank scripts
          uv run ruff format --check src tests mock_bank scripts
          uv run mypy src/cua
      - name: Unit and integration tests (headless browser against in-process mock bank)
        run: uv run pytest -q
      - name: Audit published evidence and artifacts for secrets / PII
        run: uv run python scripts/audit_evidence.py
      - name: Replay the committed, discovered capabilities on a fresh machine (15 scenarios, each twice)
        run: |
          cp .env.example .env
          make mock
          uv run python scripts/generate_evidence.py --out "$RUNNER_TEMP/evidence"
          uv run python scripts/audit_evidence.py "$RUNNER_TEMP/evidence"
